[project]
name = "hackerrank-orchestrate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "colorama>=0.4.6",
    "detoxify>=0.5.2",
    "litellm>=1.83.14",
    "lxml>=6.1.0",
    "markdownify>=1.2.2",
    "numpy>=2.4.4",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "RapidFuzz>=3.14.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "transformers>=4.57.1",
    "langdetect>=1.0.9",
    "diskcache>=5.6.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
